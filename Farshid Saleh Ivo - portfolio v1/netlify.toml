# Netlify configuration for farshidsalehivo.netlify.app
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
    publish = "."
    functions = "netlify/functions"

[build.environment]
    NODE_VERSION = "20"

# ── Redirects ──────────────────────────────────────────────────────────────
# Short, shareable URLs. The old sitemap pointed at contact.html, so keep
# that working too.
[[redirects]]
    from = "/contact"
    to = "/contactme.html"
    status = 301

[[redirects]]
    from = "/contact.html"
    to = "/contactme.html"
    status = 301

[[redirects]]
    from = "/equipment"
    to = "/equipment.html"
    status = 301

# The function source and this config sit inside the publish directory; don't
# serve them as files.
[[redirects]]
    from = "/netlify/*"
    to = "/404.html"
    status = 404
    force = true

[[redirects]]
    from = "/netlify.toml"
    to = "/404.html"
    status = 404
    force = true

[[redirects]]
    from = "/README.md"
    to = "/404.html"
    status = 404
    force = true

# ── Security headers ───────────────────────────────────────────────────────
[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
        Cross-Origin-Opener-Policy = "same-origin"
        Strict-Transport-Security = "max-age=31536000"
        # Self-hosted scripts only; styles/fonts come from Google Fonts and
        # Font Awesome, images from this site, form posts from Formspree.
        Content-Security-Policy = "default-src 'self'; base-uri 'none'; form-action 'self' https://formspree.io; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; script-src 'self'; connect-src 'self' https://formspree.io; upgrade-insecure-requests"

# ── Caching ────────────────────────────────────────────────────────────────
# Assets keep their names between deploys, so keep windows short enough that
# updates still show up.
[[headers]]
    for = "/style.css"
    [headers.values]
        Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
    for = "/app.js"
    [headers.values]
        Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
    for = "/images/*"
    [headers.values]
        Cache-Control = "public, max-age=2592000"

[[headers]]
    for = "/favicon*"
    [headers.values]
        Cache-Control = "public, max-age=2592000"

[[headers]]
    for = "/android-chrome*"
    [headers.values]
        Cache-Control = "public, max-age=2592000"

[[headers]]
    for = "/apple-touch-icon.png"
    [headers.values]
        Cache-Control = "public, max-age=2592000"

# Netlify serves .webmanifest as octet-stream by default, which makes the
# manifest easier to ignore. Send the type the spec asks for.
[[headers]]
    for = "/site.webmanifest"
    [headers.values]
        Content-Type = "application/manifest+json"
        Cache-Control = "public, max-age=3600"
